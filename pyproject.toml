[project]
name = "pre-post-compaction-demo"
version = "0.1.0"
description = "Demo: pre-compaction (OpenProvence) + post-compaction (Headroom) for local LLMs"
requires-python = ">=3.11"
dependencies = [
    "transformers>=4.57,<5",
    "headroom-ai[all]",
    "openai>=1.0",
    "gradio>=4.0",
    "plotly>=5.0",
    "rouge-score",
    "bert-score",
    "pypdf>=4.0",
    "torch>=2.8,<2.9",
    "nbformat>=5.0",
    "pandas",
    "sentencepiece>=0.2.0",
    "sentence-transformers>=3.0",
]

[tool.hatch.build.targets.wheel]
packages = ["compaction", "evaluation"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
